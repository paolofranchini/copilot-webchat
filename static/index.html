<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot CLI Webchat @ raspberrypi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <button id="closeSidebarBtn" class="close-sidebar-btn" type="button" aria-label="Chiudi sidebar">&lt;</button>
      <button id="newChatBtn" class="new-chat-btn">＋ Nuova chat</button>
      <div id="chatList" class="chat-list"></div>
      <label class="model-select">
        Modello nuova chat
        <select id="modelSelect">
          <option value="auto">Auto</option>
          <option value="claude-sonnet-5">Claude Sonnet 5</option>
          <option value="gpt-6-sol">GPT-6 Sol</option>
          <option value="gpt-5.6-sol">GPT-5.6 Sol</option>
          <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
          <option value="gpt-6-luna">GPT-6 Luna</option>
          <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
          <option value="gpt-5.3-codex">GPT-5.3 Codex</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>
      </label>
      <fieldset class="permission-select">
        <legend>Autorizzazioni chat</legend>
        <label><input type="checkbox" data-permission="shell"> Eseguire comandi</label>
        <label><input type="checkbox" data-permission="write"> Modificare file</label>
        <label><input type="checkbox" data-permission="all"> Consenti tutto</label>
      </fieldset>
      <button id="logoutBtn" class="logout-btn">Esci</button>
    </aside>

    <div class="main">
      <header>
        <button id="menuBtn" class="menu-btn">☰</button>
        <h1>🤖 Copilot CLI Webchat @ raspberrypi</h1>
      </header>

      <div id="chatUsage" class="chat-usage-summary" aria-live="polite"></div>
      <main id="messages" class="messages"></main>

      <div id="attachmentPicker" class="attachment-picker" hidden>
        <label id="attachmentDropzone" class="attachment-dropzone" for="attachmentInput">
          <span>Clicca per selezionare o trascina immagini</span>
          <small>PNG, JPEG, GIF o WebP · massimo 10 MB ciascuna</small>
        </label>
        <div id="attachmentPreviews" class="attachment-previews"></div>
        <input id="attachmentInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      </div>

      <form id="chatForm" class="input-bar">
        <button type="button" id="attachmentBtn" class="attachment-btn" aria-label="Allega immagini" aria-expanded="false">+</button>
        <textarea id="input" placeholder="Scrivi un messaggio..." rows="1" autofocus></textarea>
        <button type="submit" id="sendBtn">Invia</button>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
